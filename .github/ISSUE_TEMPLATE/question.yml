name: Design question or missing information
description: Track an existing Q ID or an unresolved interface requirement.
title: "[Question] "
body:
  - type: input
    id: question-id
    attributes:
      label: Existing question ID
      description: Use the Q ID from docs/open-questions.md, or write new.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question and affected decision
      description: Explain what answer is needed and what it changes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available evidence and closure conditions
      description: Link source files, code revisions or measurements; separate proposals from confirmed facts.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner or suggested reviewers
      description: State whether the responsibility is accepted or only proposed. Unknown is TBD.
