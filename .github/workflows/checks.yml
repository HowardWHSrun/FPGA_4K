name: Shared-source documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source links and imported-file integrity
        run: python3 scripts/check_docs.py
