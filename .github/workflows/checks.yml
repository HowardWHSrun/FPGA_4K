name: Documentation and reference simulations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check documentation links and imported-source integrity
        run: python3 scripts/check_docs.py

  reference-simulations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Fetch and verify pinned reference source
        run: python3 scripts/fetch_reference.py fpga512
      - name: Run behavioral reference tests without hardware
        run: python3 scripts/run_reference_checks.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-simulation-evidence
          path: build/reference-checks/
          if-no-files-found: ignore
