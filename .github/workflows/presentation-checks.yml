name: Presentation checks
on:
  push:
    branches: [presentation]
    paths:
      - index.html
      - overview-2026-09-23.html
      - overview-2026-10-14-v2.html
      - overview-2026-10-14-v3.html
      - overview-2026-10-15-v4.html
      - scripts/check_overview.mjs
      - presentation/**
      - .github/workflows/presentation-checks.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presentation-checks
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check repository, source and JavaScript
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_hardware.py
          node --check presentation/compact/app.js
          node --check presentation/compact/slides.js
          node --check presentation/model-source.js
          node --check presentation/fpga/app.js
          node --check presentation/fpga/slides.js
          node --check presentation/fpga/entry.js
          node --check presentation/fpga/review.js
          node --check presentation/overview/current-slides-v3.js
          node --check presentation/overview/current-entry-v3.js
          node --check presentation/overview/current-interaction-v3.js
          node --check presentation/overview/current-slides-v4.js
          node --check presentation/overview/current-entry-v4.js
          node --check presentation/overview/current-interaction-v4.js
          node --check presentation/overview/current-slides-v5.js
          node --check presentation/overview/current-approaches-v5.js
          node --check presentation/overview/current-entry-v5.js
          node --check presentation/overview/current-interaction-v5.js
          node --check scripts/check_overview.mjs
          python3 scripts/check_fpga_review.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import base64, gzip, hashlib, json, re
          manifest = json.loads(Path('presentation/compact/manifest.json').read_text())
          raw = Path(manifest['source_path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == manifest['source_sha256']
          source = json.loads(Path('presentation/model-source.js').read_text().split('window.PRESENTATION_MODEL_SOURCE = ', 1)[1].strip().removesuffix(';'))
          assert gzip.decompress(base64.b64decode(source['data'])) == raw
          for page in ['index.html', 'overview-2026-09-23.html', 'overview-2026-10-14-v2.html', 'overview-2026-10-14-v3.html', 'overview-2026-10-15-v4.html']:
              html = Path(page).read_text()
              for asset in re.findall(r'(?:src|href)="(presentation/[^\"]+)"', html):
                  target = Path(urlsplit(asset).path)
                  assert target.is_file() or (target.is_dir() and (target / 'index.html').is_file()), asset
          print('PASS: historical compact STL and source hash, overview assets, and nested links verified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview-and-historical-presentation-bundle
          path: |
            index.html
            overview-2026-09-23.html
            overview-2026-10-14-v2.html
            overview-2026-10-14-v3.html
            overview-2026-10-15-v4.html
            scripts/check_overview.mjs
            .nojekyll
            presentation/overview/
            presentation/compact/
            presentation/model-source.js
            presentation/fpga/
            hardware/fpga-board/
            hardware/fpga-100t-review/
            hardware/fpga-interface-study/
          include-hidden-files: true
