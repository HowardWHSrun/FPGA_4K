name: Presentation checks
on:
  push:
    branches: [presentation]
    paths:
      - index.html
      - presentation/**
      - .github/workflows/presentation-checks.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: presentation-checks
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: presentation
      - name: Index the active compact presentation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lib = Path('docs/library.md')
          text = lib.read_text()
          text = text.replace('[Presentation guide](../presentation/README.md)', '[Presentation guide](../presentation/compact/README.md)')
          text = text.replace('[Editing guide](../presentation/README.md)', '[Editing guide](../presentation/compact/README.md)')
          text = text.replace('[Model derivation](../presentation/manifest.json)', '[Model provenance](../presentation/compact/manifest.json)')
          text = text.replace('This branch-only starter uses the original assembly mesh and a separately labeled, new provisional compact connection study. It is not the unrecovered earlier shortened CAD revision or a fabrication release.', 'The active root presentation uses the compact B v1 STL supplied by Howard on September 22, with unchanged geometry. Older original-based visualization studies remain separate and are not used by the root page. Detailed slides are placeholders; this is not a fabrication release.')
          lib.write_text(text)
          path = Path('sources/manifest.json')
          data = json.loads(path.read_text())
          data['presentation_derivation'] = {'manifest': 'presentation/compact/manifest.json', 'branch': 'presentation', 'source': 'hardware/assembly/stacked_headboard_compact_B_v1.stl', 'status': 'supplied compact assembly; exact source bytes preserved; no geometric changes'}
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/library.md sources/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Index active supplied-compact presentation and provenance'
            git push origin HEAD:presentation
          fi
      - name: Check repository, source and JavaScript
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_hardware.py
          node --check presentation/compact/app.js
          node --check presentation/compact/slides.js
          node --check presentation/model-source.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import base64, gzip, hashlib, json, re
          manifest = json.loads(Path('presentation/compact/manifest.json').read_text())
          raw = Path(manifest['source_path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == manifest['source_sha256']
          source = json.loads(Path('presentation/model-source.js').read_text().split('window.PRESENTATION_MODEL_SOURCE = ', 1)[1].strip().removesuffix(';'))
          assert gzip.decompress(base64.b64decode(source['data'])) == raw
          html = Path('index.html').read_text()
          for asset in re.findall(r'(?:src|href)="(presentation/[^\"]+)"', html):
              assert Path(urlsplit(asset).path).is_file(), asset
          print('PASS: exact compact STL, source hash, and active local assets verified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-presentation-offline
          path: |
            index.html
            .nojekyll
            presentation/compact/
            presentation/model-source.js
          include-hidden-files: true
