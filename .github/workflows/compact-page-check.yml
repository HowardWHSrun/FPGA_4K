name: Compact presentation page check
on:
  push:
    branches: [presentation]
    paths:
      - index.html
      - presentation/compact/**
      - presentation/model-source.js
      - .github/workflows/compact-page-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-page-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Syntax and exact source check
        run: |
          node --check presentation/compact/app.js
          node --check presentation/compact/slides.js
          node --check presentation/compact/interaction.js
          node --check presentation/model-source.js
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          source = Path('presentation/model-source.js').read_text()
          data = json.loads(source.split('window.PRESENTATION_MODEL_SOURCE = ', 1)[1].strip().removesuffix(';'))
          raw = gzip.decompress(base64.b64decode(data['data']))
          assert hashlib.sha256(raw).hexdigest() == '1aa6547321ffec16be82f6e58fd27fd49825b74ba4f23b1c36394f7b9f2eac46'
          assert raw == Path('hardware/assembly/stacked_headboard_compact_B_v1.stl').read_bytes()
          print('Compact source matches supplied STL byte for byte.')
          PY
          git diff --check
      - name: Verify deployed Pages assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = 'https://howardwhsrun.github.io/FPGA_4K/'
          paths = ['index.html', 'presentation/compact/app.js', 'presentation/compact/style.css', 'presentation/compact/slides.js', 'presentation/model-source.js', 'presentation/compact/refinements.css', 'presentation/compact/interaction.js']
          for attempt in range(18):
              try:
                  checked = []
                  for path in paths:
                      url = base + ('' if path == 'index.html' else path) + '?check=' + os.environ['GITHUB_SHA']
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          raw = response.read()
                          assert response.status == 200
                      assert raw == Path(path).read_bytes(), 'Pages has not published current ' + path
                      checked.append({'path': path, 'http_status': 200, 'sha256': hashlib.sha256(raw).hexdigest()})
                  Path('live-page-check.json').write_text(json.dumps({'url': base, 'commit': os.environ['GITHUB_SHA'], 'assets': checked}, indent=2))
                  print('LIVE PAGES VERIFIED: root HTML and all active assets match this commit.')
                  break
              except Exception as error:
                  print('Deployment check', attempt + 1, str(error), flush=True)
                  if attempt == 17:
                      raise
                  time.sleep(8)
          PY
      - name: Render the public page in headless Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,900 --virtual-time-budget=10000 --dump-dom "https://howardwhsrun.github.io/FPGA_4K/?check=${GITHUB_SHA}" > live-rendered.html 2> chrome.log
          grep -q 'data-rendered="true"' live-rendered.html
          grep -q 'data-model="compact_B_v1"' live-rendered.html
          grep -q 'data-triangles="650"' live-rendered.html
          grep -q 'data-presentation-revision="review-v2.1"' live-rendered.html
          grep -q 'data-controller="KR260_schematic"' live-rendered.html
          echo 'LIVE BROWSER VERIFIED: compact_B_v1, KR260 schematic, and review-v2.1 finishing layer rendered.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-page-verification
          path: |
            live-page-check.json
            live-rendered.html
            chrome.log
