<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browse and zoom detailed native KiCad sheets for the current single-link interposer, preserved three-port studies and selected XC7A25T FPGA.">
<title>KiCad schematic viewer | FPGA 4K</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="viewer.css?v=simple1">
<script type="module" src="viewer.js?v=simple1"></script>
</head>
<body>
<main>
<header class="viewer-head"><div><p>NATIVE KICAD SCHEMATIC · 29 SEPTEMBER 2026</p><h1 id="title">Schematic sheets</h1></div><nav class="view-links" aria-label="Schematic views"><a class="project-library-link" href="../library/">Project library</a><a id="simple" href="simple.html" hidden>Simple overview ↗</a><a id="back" href="../adapter/#schematic">Back to board ↗</a></nav></header>
<div class="toolbar">
<div class="sheet-controls"><button id="previous" aria-label="Previous sheet">‹</button><label for="sheet">Sheet</label><select id="sheet" aria-label="Choose a schematic sheet"></select><button id="next" aria-label="Next sheet">›</button></div>
<div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit sheet</button><a id="pdf" href="../adapter/" target="_blank" rel="noopener">Open PDF ↗</a></div>
</div>
<div class="sheet-stage" id="stage" tabindex="0" aria-label="Schematic sheet. Use the zoom controls, then drag to move around the sheet. Left and right arrow keys switch sheets."><div class="paper-wrap" id="paper-wrap"><img id="paper" alt="Native KiCad schematic sheet" draggable="false"></div><p id="loading" role="status">Loading schematic…</p></div>
<footer><p id="status"></p><span>Zoom, then drag to inspect pins. The PDF contains every sheet.</span></footer>
</main>
</body>
</html>
