<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="160" viewBox="0 0 1050 160" role="img" aria-labelledby="title desc">
<title id="title">Cabled XEM connection to the existing LDO board</title><desc id="desc">XEM8305 connects by an unspecified cable to a provisional small routing board, which connects through the existing LDO J1 and J19 interfaces. The ASIC path is J2. No cable contact assignment is specified.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7992a2"/></marker></defs>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<rect x="8" y="35" width="154" height="78" rx="8" fill="#eef3f7" stroke="#9ab2c1"/><text x="85" y="66" font-size="16" fill="#294959">XEM8305</text><text x="85" y="88" font-size="11" fill="#69808f">Separate remote module</text>
<path d="M178 73H328" stroke="#b08d4b" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="253" y="46" font-size="13" fill="#8d713c">Cable</text><text x="253" y="103" font-size="10" fill="#8d713c">Connector / pinout TBD</text>
<rect x="344" y="35" width="180" height="78" rx="8" fill="#e4f3f2" stroke="#6caaa7"/><text x="434" y="65" font-size="16" fill="#28656a">Small routing board</text><text x="434" y="88" font-size="11" fill="#528489">18 × 25 mm provisional</text>
<path d="M540 73H653" stroke="#7992a2" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="596" y="45" font-size="13" fill="#526c7c">J1 + J19</text><text x="596" y="105" font-size="10" fill="#69808f">Mating / pin review open</text>
<rect x="668" y="35" width="178" height="78" rx="8" fill="#eaf2e6" stroke="#97b38b"/><text x="757" y="65" font-size="16" fill="#477442">Existing LDO board</text><text x="757" y="88" font-size="11" fill="#698261">Gerald native source</text>
<path d="M861 73H914" stroke="#7992a2" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="889" y="46" font-size="12" fill="#526c7c">J2</text>
<rect x="929" y="45" width="112" height="58" rx="8" fill="#eef3f7" stroke="#9ab2c1"/><text x="985" y="78" font-size="15" fill="#294959">ASIC</text>
<text x="525" y="143" font-size="11" fill="#728591">Functional connection concept · regulator and cable power responsibilities still need qualification</text>
</g></svg>
