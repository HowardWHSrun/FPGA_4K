<g data-pin="4" data-role="ground"><title>4 · GND</title><rect x="650" y="305" width="62" height="64" rx="7" fill="#697782" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><text x="681" y="347" text-anchor="middle" class="number">4</text></g>
