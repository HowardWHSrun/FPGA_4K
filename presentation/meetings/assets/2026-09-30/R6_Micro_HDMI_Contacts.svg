<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">Custom micro-HDMI 19-contact arrangement</title>
<desc id="desc">Board receptacle, looking into the mating opening. Upper row from left to right: 19, 17, 15, 13, 11, 9, 7, 5, 3, 1. Lower row: 18, 16, 14, 12, 10, 8, 6, 4, 2. Blue contacts 3/5 and 6/8 carry recording to XEM. Green 12/14 carry commands from XEM. Purple 1/2/15/17/18 provide reference and programming. Grey 4/7/10/13/16 are ground. Gold 9/11 are Reserved, and 19 carries protected 12 V.</desc>
<!-- Contact orientation: Molex SD-46765-001 sheet 2. Enlarged explanatory view, not to scale. Roles: R12 J201 contact map, 29 September 2026. -->
<defs><linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4eaeb"/><stop offset=".55" stop-color="#f8faf8"/><stop offset="1" stop-color="#cdd8dc"/></linearGradient></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#294252}.flow{font-size:26px;font-weight:500}.number{font-size:30px;font-weight:600;fill:#fffefa}.key{font-size:23px}.small{font-size:21px;fill:#647581}</style>
<text x="90" y="76" class="flow" style="fill:#347b99">Recording → XEM</text>
<text x="545" y="76" class="flow" style="fill:#32816e">Commands ← XEM</text>
<path d="M90 148H830Q855 148 867 172L894 231V363Q894 402 853 402H67Q26 402 26 363V231L53 172Q65 148 90 148Z" fill="url(#shell)" stroke="#9db0ba" stroke-width="3"/>
<path d="M94 171H826L869 241V357Q869 379 846 379H74Q51 379 51 357V241Z" fill="#243a47" stroke="#627d8b" stroke-width="2"/>
<rect x="72" y="272" width="776" height="22" rx="6" fill="#d8e1df"/>
<g data-pin="19" data-role="power"><title>19 · 12 V</title><rect x="95" y="191" width="62" height="64" rx="7" fill="#b78040" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><text x="126" y="233" text-anchor="middle" class="number">19</text></g>
<g data-pin="17" data-role="jtag"><title>17 · TCK</title><rect x="169" y="191" width="62" height="64" rx="7" fill="#785697" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><text x="200" y="233" text-anchor="middle" class="number">17</text></g>
<g data-pin="15" data-role="jtag"><title>15 · TDI</title><rect x="243" y="191" width="62" height="64" rx="7" fill="#785697" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><text x="274" y="233" text-anchor="middle" class="number">15</text></g>
<g data-pin="13" data-role="ground"><title>13 · GND</title><rect x="317" y="191" width="62" height="64" rx="7" fill="#697782" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><text x="348" y="233" text-anchor="middle" class="number">13</text></g>
