<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><title>Current micro-HDMI 19-contact schematic</title><desc>Breakout J101 pin functions. Pins 6, 8, 9 and 11 are unconnected. SH is the separate shell.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126a71"/></marker></defs><rect width="1440" height="760" fill="white"/><g font-family="Arial,Helvetica,sans-serif" transform="translate(-110 0)"><text x="390" y="37" font-size="27" font-weight="600" fill="#172a32">J101 · micro-HDMI Type D</text><text x="825" y="37" font-size="18" fill="#53656b">Signal flow at the Artix-7 FPGA</text><rect x="390" y="70" width="230" height="555" fill="#f6f9f8" stroke="#172a32" stroke-width="2"/><text x="465" y="354" transform="rotate(-90 465 354)" text-anchor="middle" font-size="23" fill="#53656b">19 contacts</text><g data-pin="1" data-signal="JTAG_VREF_1V8" data-status="in"><text x="600" y="95" text-anchor="end" font-size="20" fill="#172a32">1</text><line x1="620" y1="100" x2="800" y2="100" stroke="#708a8e" stroke-width="2"/><line x1="744" y1="100" x2="690" y2="100" stroke="#126a71" stroke-width="2.2" marker-end="url(#arrow)"/><text x="825" y="107" font-size="23" fill="#172a32">JTAG_VREF_1V8</text><text x="1175" y="106" font-size="17" fill="#53656b">From Artix-7 FPGA</text></g><g data-pin="2" data-signal="JTAG_TMS" data-status="out"><text x="600" y="122" text-anchor="end" font-size="20" fill="#172a32">2</text><line x1="620" y1="127" x2="800" y2="127" stroke="#708a8e" stroke-width="2"/><line x1="690" y1="127" x2="744" y2="127" stroke="#126a71" stroke-width="2.2" marker-end="url(#arrow)"/><text x="825" y="134" font-size="23" fill="#172a32">JTAG_TMS</text><text x="1175" y="133" font-size="17" fill="#53656b">To Artix-7 FPGA</text></g><g data-pin="3" data-signal="REC_P" data-status="in"><text x="600" y="149" text-anchor="end" font-size="20" f