*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1240px;margin:0 auto;padding:16px}

<script type="module">
// FPGA-LDO stack, option B only, V21 (6 Nov 2026): small router + one Hirose DF40C-120 pair (120 pins, 1.5 mm) + plug-in LDO board and Frontend. Boards: PCB-5 (0.8 mm) and Artix Frontend V37 exported from KiCad as GLB.
// Connectors: drawn here from the catalogue dimensions (housing, every contact at its pitch, tails, fittings), placed with
// the same outline as the manufacturer models. VENDOR = true (local copy) swaps in Hirose STEP models tessellated by KiCad. Frame: X width, Y thickness, Z distance from probe edge (mm).
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const view = document.getElementById('view');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const d1 = new THREE.DirectionalLight(0xffffff, 1.4); d1.position.set(60, 90, 70); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.6); d2.position.set(-70, 30, -60); scene.add(d2);

// stack frame (mm): X board width, Y stack thickness (upper pair +Y), Z along the ASIC boards from the probe edge
const LB = 17.13, HUB0 = 10.34;
const DF = { cx: -0.22, cz: 13.38, sLen: 18.6, sWid: 3.4, sH: 0.95, pLen: 17.8, pWid: 2.6, pH: 0.55 };
const C = { hub: 0x5f6b78, flex: 0xd4a017, stiff: 0x8d6e3f, plug: 0x8a5cc2, sock: 0xc9772b, mated: 0xe08a2e, open: 0x9aa0a6,
            reg: 0x23272c, chip: 0x111317, ldo: 0x1f6f4e, probe: 0xb03a2e, ind: 0x55585e, hdmi: 0x3c464b, cable: 0x22262a, a: 0x2a6b52 };
const mats = {}; const mat = (c, o) => { const k = c + JSON.stringify(o || {}); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0.05 }, o || {}))); };

const CONN = {};
// ---- drawn connector models: one merged mesh per material ----
const CM = { gold: new THREE.MeshStandardMaterial({ color: 0xd9ad4a, metalness: 0.75, roughness: 0.3 }),
  tin: new THREE.MeshStandardMaterial({ color: 0xbfc3c8, metalness: 0.75, roughness: 0.35 }),
  ivory: new THREE.MeshStandardMaterial({ color: 0xebe4d1, roughness: 0.6 }),

function Part() {

    b(m, x0, x1, y0, y1, z0, z1) {
      const [a0, a1] = [Math.min(x0, x1), Math.max(x0, x1)], [b0, b1] = [Math.min(y0, y1), Math.max(y0, y1)], [c0, c1] = [Math.min(z0, z1), Math.max(z0, z1)];
      const g = new THREE.BoxGeometry(a1 - a0, b1 - b0, c1 - c0); g.translate((a0 + a1) / 2, (b0 + b1) / 2, (c0 + c1) / 2); (P[m] = P[m] || []).push(g);

// Hirose DF40 (0.4 mm pitch, 1.5 mm mated), model frame as Hirose's STEP: X width, Y length, board face at z = 0, body toward -Z.
// Receptacle DF40C-nnDS: 1.4 mm tall, outline 3.38 x (span + 3.0) mm; frame with a central contact island.
function df40S(n) {
  const p = Part(), k = n / 2, sp = (k - 1) * 0.4, L = sp + 3.0, Lh = L - 0.8, H = 1.4;
  p.b('ivory', -1.35, 1.35, -Lh / 2, Lh / 2, -0.3, 0);                                         // floor
  for (const s of [-1, 1]) {
    p.b('ivory', s * 1.05, s * 1.35, -Lh / 2, Lh / 2, -H, -0.3);                              // side walls
    p.b('ivory', -1.05, 1.05, s * (Lh / 2 - 0.45), s * Lh / 2, -H, -0.3);                     // end walls
    p.b('tin', -1.15, 1.15, s * Lh / 2, s * L / 2, -1.2, 0.05);                                // metal fittings
  }
  p.b('ivory', -0.35, 0.35, -sp / 2 - 0.4, sp / 2 + 0.4, -1.05, -0.3);                        // contact island
  for (let i = 0; i < k; i++) { const y = -sp / 2 + i * 0.4; for (const s of [-1, 1]) {
    p.b('gold', s * 0.35, s * 0.39, y - 0.09, y + 0.09, -1.0, -0.35);                         // contact on the island
    p.b('gold', s * 1.35, s * 1.69, y - 0.09, y + 0.09, -0.08, 0.05); } }                     // SMT tail
  return p.done();
}
// Header DF40C-nnDP: 1.14 mm tall incl. tails, outline 2.97 x (span + 1.92) mm; its walls enter the receptacle frame.
function df40P(n) {
  const p = Part(), k = n / 2, sp = (k - 1) * 0.4, L = sp + 1.92, Lh = sp + 1.2;
  for (const s of [-1, 1]) {
    p.b('ivory', s * 0.42, s * 1.0, -Lh / 2, Lh / 2, -1.14, -0.1);                            // contact walls
    p.b('ivory', -0.42, 0.42, s * (Lh / 2 - 0.15), s * Lh / 2, -1.14, -0.1);                  // end walls
    p.b('tin', -0.9, 0.9, s * Lh / 2, s * L / 2, -0.12, 0);                                    // metal fittings
  }
  p.b('ivory', -0.42, 0.42, -Lh / 2, Lh / 2, -0.4, -0.1);                                     // web over the groove
  for (let i = 0; i < k; i++) { const y = -sp / 2 + i * 0.4; for (const s of [-1, 1]) {
    p.b('gold', s * 1.0, s * 1.04, y - 0.09, y + 0.09, -1.0, -0.3);
    p.b('gold', s * 1.0, s * 1.485, y - 0.09, y + 0.09, -0.1, 0); } }
  return p.done();
}
const AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
// part on a board face: n = face normal axis, face = its coordinate, s = +1 body grows toward +n, -1 toward -n;
// long = axis of the connector's long side; c = centre on the two in-plane axes
function conn(g, key, n, face, s, long, c) {
  const src = CONN[key]; if (!src) return false;
  const c2 = AX[n].clone().multiplyScalar(-s), c1 = AX[long].clone(), c0 = new THREE.Vector3().crossVectors(c1, c2);
  const inner = src.clone(true), w = new THREE.Group(); w.add(inner);
  w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(c0, c1, c2)); w.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(w), ctr = bb.getCenter(new THREE.Vector3());
  const pos = new THREE.Vector3(c.x !== undefined ? c.x - ctr.x : 0, c.y !== undefined ? c.y - ctr.y : 0, c.z !== undefined ? c.z - ctr.z : 0);
  pos[n] = s > 0 ? face - bb.min[n] : face - bb.max[n];
  w.position.copy(pos); g.add(w); return true;
}
function connA(g, key, ix, iy, iz, anchor, target) {
  const src = CONN[key]; if (!src) return false;
  const inner = src.clone(true), w = new THREE.Group(); w.add(inner);
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(...ix), new THREE.Vector3(...iy), new THREE.Vector3(...iz));
  w.quaternion.setFromRotationMatrix(m);
  const a = new THREE.Vector3(...anchor).applyMatrix4(m);
  w.position.set(target[0] - a.x, target[1] - a.y, target[2] - a.z); g.add(w); return true;
}
const dfSock = (g, y, on) => conn(g, '80DS', 'y', y, -1, 'x', { x: DF.cx, z: DF.cz }) || box(g, DF.cx - DF.sLen / 2, DF.cx + DF.sLen / 2, y - DF.sH, y, DF.cz - DF.sWid / 2, DF.cz + DF.sWid / 2, mat(on ? C.mated : C.open));
const dfPlug = (g, y, on) => conn(g, '80DP', 'y', y, +1, 'x', { x: DF.cx, z: DF.cz }) || box(g, DF.cx - DF.pLen / 2, DF.cx + DF.pLen / 2, y, y + DF.pH, DF.cz - DF.pWid / 2, DF.cz + DF.pWid / 2, mat(on ? C.mated : C.open));
let PCB5, FE; const options = {};
function mkOption(k) { const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root); return options[k] = { root, groups: {}, exp: {} }; }
function grp(o, k) { const g = new THREE.Group(); o.groups[k] = g; o.root.add(g); return g; }
function place(src, g, pos, rot) { const w = src.clone(true); const h = new THREE.Group(); h.add(w); w.rotation.set(...rot); w.position.set(...pos); g.add(h); }

function asicPairs(o) {
  // V15: ASIC boards 0.8 mm thick (Howard, 6 Nov). Board bottoms: upper 3.1 and 3.1+TA+1.5; lower -1.5-TA and that -1.5-TA.
  const TA = 0.8, u1 = 1.6 + 1.5, u2 = u1 + TA + 1.5, l1 = -1.5 - TA, l2 = l1 - 1.5 - TA;
  const defs = { upper: [[u1, true, true], [u2, true, false]], lower: [[l1, true, true], [l2, false, true]] };
  for (const k in defs) {
    const g = grp(o, k);
    for (const [y, sockOn, plugOn] of defs[k]) {
      place(PCB5, g, [135.323, y, 84.523], [0, Math.PI, 0]);
      box(g, -10.9, -0.38, y + TA, y + TA + 0.5, 0.51, 9.48, mat(C.chip)); box(g, 0.38, 10.9, y + TA, y + TA + 0.5, 0.51, 9.48, mat(C.chip));
      dfSock(g, y, sockOn); dfPlug(g, y + TA, plugOn);
      for (const x of [-8, -3, 3, 8]) box(g, x - 0.15, x + 0.15, y + TA / 2 - 0.15, y + TA / 2 + 0.15, -6, 0.3, mat(C.probe));
    }
  }
  o.exp.upper = [0, 7, 0]; o.exp.lower = [0, -7, 0];
}
function hdmi(g, [x, y, z], up) {
  if (up) { box(g, x - 5.5, x + 5.5, y - 2.75, y + 2.75, z, z + 20, mat(C.hdmi)); box(g, x - 2.25, x + 2.25, y - 2.25, y + 2.25, z + 20, z + 35, mat(C.cable)); }
  else { box(g, x - 5.5, x + 5.5, y, y + 20, z - 2.75, z + 2.75, mat(C.hdmi)); box(g, x - 2.25, x + 2.25, y + 20, y + 35, z - 2.25, z + 2.25, mat(C.cable)); }
}
// LDO board top: DF40C-70DP x2 at the Frontend J1/J2 positions; Frontend V37 DF40C-70DS x2 (1.5 mm). dz shifts the Frontend end along L.
function plugs70(g, y, dz) {
  conn(g, '70DP', 'y', y, +1, 'z', { x: -8.745, z: 31.095 + dz }) || box(g, -11.16, -6.33, y, y + 0.55, 22.74 + dz, 39.45 + dz, mat(C.mated));
  conn(g, '70DP', 'y', y, +1, 'x', { x: 0.955, z: 20.225 + dz }) || box(g, -7.40, 9.31, y, y + 0.55, 17.81 + dz, 22.64 + dz, mat(C.mated));
}
// V20: one DF40C-120 pair lies across the router just past the ASIC boards. DF40C-120DP header 25.52 x 2.97 mm (Hirose page);
// DF40C-120DS socket about 26.6 x 3.38 mm (estimated from the 70/80-pin sockets). The connector end of the router and of the
// LDO board widens to W120; BAND = connector strip length along L.
const W120 = 27.4, DF120_C = 2.1, BAND = 4.6;
function routerSocket(g, y, L) { conn(g, '120DS', 'y', y, +1, 'x', { x: 0, z: L + DF120_C }); }
function modulePlug(g, y, L) { conn(g, '120DP', 'y', y, -1, 'x', { x: 0, z: L + DF120_C }); }
function ldoModule(o, L0, yB) {
  const y0 = yB + 1.5, y1 = y0 + 1.6, hat = grp(o, 'hat');   // 1.5 mm DF40 mated height
  modulePlug(hat, y0, L0);
  box(hat, -W120 / 2, W120 / 2, y0, y1, L0, L0 + BAND, mat(C.ldo)); box(hat, -11.32, 11.32, y0, y1, L0 + BAND, L0 + 25.47, mat(C.ldo));
  for (const x of [-7, -2.5, 2, 6.5]) for (const z of [L0 + 14, L0 + 18.5]) box(hat, x - 1.5, x + 1.5, y0 - 0.75, y0, z - 1.5, z + 1.5, mat(C.reg));
  box(hat, -9.5, -5.5, y0 - 0.9, y0, L0 + 21, L0 + 25, mat(C.reg));
  for (const x of [-3.5, 0.5]) box(hat, x - 1, x + 1, y0 - 1, y0, L0 + 22.2, L0 + 23.8, mat(C.ind));
  for (const x of [4, 7]) box(hat, x - 0.85, x + 0.85, y0 - 0.9, y0, L0 + 22.4, L0 + 23.6, mat(C.ind));
  box(hat, 8.5, 11.5, y0 - 0.75, y0, L0 + 21.5, L0 + 24.5, mat(C.reg));
  plugs70(hat, y1, L0 - 17.63);
  const dz = L0 - 17.63, fe = grp(o, 'fe'), yF = y1 + 1.5;
  conn(fe, '70DS', 'y', yF, -1, 'z', { x: -8.745, z: 31.095 + dz }) || box(fe, -11.16, -6.33, yF - 0.95, yF, 22.74 + dz, 39.45 + dz, mat(C.mated));
  conn(fe, '70DS', 'y', yF, -1, 'x', { x: 0.955, z: 20.225 + dz }) || box(fe, -7.40, 9.31, yF - 0.95, yF, 17.81 + dz, 22.64 + dz, mat(C.mated));
  place(FE, fe, [113.505, yF, 139.575 + dz], [0, Math.PI, 0]);

const ROUTER_END = LB + 0.5 + BAND;                    // just past the DF40C-120 footprint
function buildB() {
  const o = mkOption('B'); asicPairs(o);

  box(hub, -11.32, 11.32, 0, 1.6, HUB0, LB + 0.5, mat(C.hub)); box(hub, -W120 / 2, W120 / 2, 0, 1.6, LB + 0.5, ROUTER_END, mat(C.hub));

}
const DFP = [['DF40C-80DS-0.4V(51)', 'ASIC boards, underside (J3)', 4, 'Hirose · LCSC C312960 · on PCB-5'],
            ['DF40C-80DP-0.4V(51)', 'ASIC boards, top (J4)', 4, 'Hirose · LCSC C294544 · on PCB-5'],
            ['DF40C-80DP-0.4V(51)', 'Router top → upper ASIC pair', 1, 'Hirose · LCSC C294544'],
            ['DF40C-80DS-0.4V(51)', 'Router underside → lower ASIC pair', 1, 'Hirose · LCSC C312960']];

const INFO = {

               ['DF40C-120DP-0.4V(51)', 'LDO board underside (header), 1.5 mm mated', 1, 'Hirose · 25.52 × 2.97 mm'], ...FE70],
       pros: ['Router 11.9 mm long; boards only 1.5 mm apart', 'Same DF40 family as the ASIC connectors', '120 pins: 108 signals + 10 power + 2 ground'],

const REMOVABLE = { B: ['hat', 'fe'] };

const MASS = { pcb6: 0.37, pcb10: 0.25,                 // g/cm²: 1.6 mm 6-layer router/LDO; 0.8 mm 10-layer ASIC board
  df80S: 0.12, df80P: 0.06, df70P: 0.05,                 // DF40 model volumes 46.5 / 19.9 / 17.8 mm³

const ASIC1 = 22.07 * 17.13 / 100 * MASS.pcb10 + MASS.chips + MASS.asicPassives + MASS.df80S + MASS.df80P;

const g1 = v => v.toFixed(1);
function weightLine() {
  document.getElementById('wt').textContent = `Estimated weight — on the head: ${g1(WEIGHT.B.head)} g   ·   while recording: ${g1(WEIGHT.B.total)} g`;
}
function info() {
  const wrap = document.getElementById('wrap'), el = document.getElementById('info');
  const d = INFO[cur], total = d.parts.reduce((n, p) => n + p[2], 0);
  el.innerHTML = `<h2>${d.title}</h2><p class="sub">${d.sub}</p>
    <h3>Connectors (${total} parts)</h3><table>${d.parts.map(([pn, where, q, note]) =>

    <h3>Weight (estimate, ±30 %)</h3><table><tr><td>4 ASIC boards</td><td class="q">${g1(WEIGHT[cur].asic)} g</td></tr><tr><td>Router</td><td class="q">${g1(WEIGHT[cur].router)} g</td></tr><tr><td><b>Stays on the head</b></td><td class="q"><b>${g1(WEIGHT[cur].head)} g</b></td></tr><tr><td>LDO board + Frontend (removable)</td><td class="q">${g1(WEIGHT[cur].module)} g</td></tr><tr><td><b>Total while recording</b></td><td class="q"><b>${g1(WEIGHT[cur].total)} g</b></td></tr></table><p class="w">boards 0.37 g/cm² (1.6 mm) and 0.25 g/cm² (0.8 mm); connector masses from the real 3D-model volumes, connector and Frontend masses estimated; HDMI plug and cable, probes and glue not included.</p>
    <h3>Pros</h3><ul>${d.pros.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3>Cons</h3><ul>${d.cons.map(x => `<li>${x}</li>`).join('')}</ul>`;
  wrap.classList.add('side'); resize();
}
let cur = 'B', mode = 'head';
// ---- V10 animation: groups glide to their targets; Play runs exploded -> assembled one part at a time, then repeats
function setTarget(g, t) { g.userData.target = new THREE.Vector3(...t); }
const ORDER = ['lower', 'upper', 'board', 'hub', 'flex', 'hat', 'fe'];
let playing = false, timer = null;
function playStep(i) {
  if (!playing) return;
  const shown = [cur];
  if (i === 0) for (const k of shown) for (const g in options[k].groups) setTarget(options[k].groups[g], options[k].exp[g] || [0, 0, 0]);
  if (i >= 1 && i <= ORDER.length) for (const k of shown) { const g = options[k].groups[ORDER[i - 1]]; if (g) setTarget(g, [0, 0, 0]); }
  const next = i > ORDER.length ? 0 : i + 1;
  timer = setTimeout(() => playStep(next), i === 0 ? 1400 : i > ORDER.length ? 2200 : 700);
}
function setPlay(on) {
  playing = on; clearTimeout(timer); controls.autoRotate = on; controls.autoRotateSpeed = 1.2;
  document.getElementById('play').classList.toggle('on', on);
  document.getElementById('play').textContent = on ? '■ Stop' : '▶ Play assembly';
  if (on) playStep(0); else apply();
}
function apply() {
  const shown = [cur];
  for (const k in options) {
    const o = options[k]; o.root.visible = shown.includes(k);
    for (const g in o.groups) { setTarget(o.groups[g], mode === 'exploded' ? (o.exp[g] || [0, 0, 0]) : [0, 0, 0]); o.groups[g].visible = !(mode === 'only' && REMOVABLE[k].includes(g)); }
  }
  const c = options[cur].cam;
  camera.position.set(...c[0]); controls.target.set(...c[1]); controls.update();
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  info(); weightLine();
}
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; if (playing) setPlay(false); else apply(); });
document.getElementById('play').onclick = () => setPlay(!playing);
const loader = new GLTFLoader();
const VENDOR = false;   // public copy: connectors drawn in the page (manufacturer models are not redistributed)
const VENDOR_FILES = ['DF40C-80DS', 'DF40C-80DP', 'DF40C-70DS', 'DF40C-70DP'];   // DF40C-120 is always drawn (no 120-pin model downloaded)
Promise.all([loader.loadAsync('models/ASIC_Board_PCB5_0p8mm.glb'), loader.loadAsync('models/Artix_Frontend_V37.glb'),
  ...(VENDOR ? VENDOR_FILES.map(n => loader.loadAsync('models/' + n + '.glb').catch(() => null)) : [])])
.then(([a, f, ...v]) => {
  PCB5 = a.scene; PCB5.scale.setScalar(1000); FE = f.scene; FE.scale.setScalar(1000);
  const DRAWN = { '80DS': () => df40S(80), '80DP': () => df40P(80), '70DS': () => df40S(70), '70DP': () => df40P(70), '120DS': () => df40S(120), '120DP': () => df40P(120) };
  Object.keys(DRAWN).forEach((k, i) => { if (v[i]) { v[i].scene.scale.setScalar(1000); CONN[k] = v[i].scene; } else CONN[k] = DRAWN[k](); });
  buildB(); apply();
}).catch(e => console.error(e));
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  for (const k in options) for (const g in options[k].groups) { const G = options[k].groups[g], t = G.userData.target; if (t) G.position.lerp(t, 0.12); }
  controls.update(); renderer.render(scene, camera);
});
