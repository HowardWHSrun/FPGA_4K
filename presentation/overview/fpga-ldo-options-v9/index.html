<script type="module">
// Concept V9, 6 Nov 2026: B and C plug in like A (module parallel to the hub, far end) with small Hirose DF40 parts only.
// Concept V8, 6 Nov 2026: side panel with each option's connector list and pros/cons.
// Concept V7, 6 Nov 2026: Samtec SEAM8-20-S02.0-S-08-3, SEAF8-20-05.0-S-08-3, SEAF8-20-1-S-08-2-RA are Samtec's STEP models
// (samtec.com via SnapMagic/TraceParts, 6 Nov 2026) tessellated by KiCad.
// Concept V6, 6 Nov 2026: Hirose DF40C-80DS/80DP/70DS/70DP are the manufacturer STEP models (hirose.com, 6 Nov 2026) tessellated by KiCad.
// Concept V5 (V5: Samtec heights from DigiKey/Samtec: SEAM8-S02.0 4.54 mm, SEAF8-05.0 4.57 mm, 7.00 mm mated). A: one hub/LDO board, Frontend on its far end (HDMI up). B: rigid hub with a fixed
// right-angle Samtec SEAF8-RA socket, plug-in LDO hat + Frontend. C: rigid-flex hub, flex tail with SEAM8 plug, plug-in hat.
// PCB-5 and Frontend V37 are KiCad GLB exports; everything else is a box at data-sheet size (see START_HERE.md).
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const view = document.getElementById('view');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const d1 = new THREE.DirectionalLight(0xffffff, 1.4); d1.position.set(60, 90, 70); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.6); d2.position.set(-70, 30, -60); scene.add(d2);

// stack frame (mm): X board width, Y stack thickness (upper pair +Y), Z along the ASIC boards from the probe edge
const LB = 17.13, HUB0 = 10.34;
const DF = { cx: -0.22, cz: 13.38, sLen: 18.6, sWid: 3.4, sH: 0.95, pLen: 17.8, pWid: 2.6, pH: 0.55 };
const C = { hub: 0x5f6b78, flex: 0xd4a017, stiff: 0x8d6e3f, plug: 0x8a5cc2, sock: 0xc9772b, mated: 0xe08a2e, open: 0x9aa0a6,
            reg: 0x23272c, chip: 0x111317, ldo: 0x1f6f4e, probe: 0xb03a2e, ind: 0x55585e, hdmi: 0x3c464b, cable: 0x22262a, a: 0x2a6b52 };
const mats = {}; const mat = (c, o) => { const k = c + JSON.stringify(o || {}); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0.05 }, o || {}))); };
function box(g, x0, x1, y0, y1, z0, z1, m) { const b = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m); b.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); g.add(b); }
const CONN = {};
const AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
// part on a board face: n = face normal axis, face = its coordinate, s = +1 body grows toward +n, -1 toward -n;
// long = axis of the connector's long side; c = centre on the two in-plane axes
function conn(g, key, n, face, s, long, c) {
  const src = CONN[key]; if (!src) return false;
  const c2 = AX[n].clone().multiplyScalar(-s), c1 = AX[long].clone(), c0 = new THREE.Vector3().crossVectors(c1, c2);
  const inner = src.clone(true), w = new THREE.Group(); w.add(inner);
  w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(c0, c1, c2)); w.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(w), ctr = bb.getCenter(new THREE.Vector3());
  const pos = new THREE.Vector3(c.x !== undefined ? c.x - ctr.x : 0, c.y !== undefined ? c.y - ctr.y : 0, c.z !== undefined ? c.z - ctr.z : 0);
  pos[n] = s > 0 ? face - bb.min[n] : face - bb.max[n];
  w.position.copy(pos); g.add(w); return true;
}
function connA(g, key, ix, iy, iz, anchor, target) {
  const src = CONN[key]; if (!src) return false;
  const inner = src.clone(true), w = new THREE.Group(); w.add(inner);
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(...ix), new THREE.Vector3(...iy), new THREE.Vector3(...iz));
  w.quaternion.setFromRotationMatrix(m);
  const a = new THREE.Vector3(...anchor).applyMatrix4(m);
  w.position.set(target[0] - a.x, target[1] - a.y, target[2] - a.z); g.add(w); return true;
}
// Samtec (SnapEDA/TraceParts STEP via KiCad): long axis = model X. SEAF8: board face at model z 0.57, body toward -Z.
// SEAM8: board face at model z -0.95, body toward +Z. SEAF8-RA: board face model z -4.33, mating face at model y -14.89.
const dfSock = (g, y, on) => conn(g, '80DS', 'y', y, -1, 'x', { x: DF.cx, z: DF.cz }) || box(g, DF.cx - DF.sLen / 2, DF.cx + DF.sLen / 2, y - DF.sH, y, DF.cz - DF.sWid / 2, DF.cz + DF.sWid / 2, mat(on ? C.mated : C.open));
const dfPlug = (g, y, on) => conn(g, '80DP', 'y', y, +1, 'x', { x: DF.cx, z: DF.cz }) || box(g, DF.cx - DF.pLen / 2, DF.cx + DF.pLen / 2, y, y + DF.pH, DF.cz - DF.pWid / 2, DF.cz + DF.pWid / 2, mat(on ? C.mated : C.open));
let PCB5, FE; const options = {};
function mkOption(k) { const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root); return options[k] = { root, groups: {}, exp: {} }; }
function grp(o, k) { const g = new THREE.Group(); o.groups[k] = g; o.root.add(g); return g; }
function place(src, g, pos, rot) { const w = src.clone(true); const h = new THREE.Group(); h.add(w); w.rotation.set(...rot); w.position.set(...pos); g.add(h); }

function asicPairs(o) {
  const defs = { upper: [[3.1, true, true], [6.2, true, false]], lower: [[-3.1, true, true], [-6.2, false, true]] };
  for (const k in defs) {
    const g = grp(o, k);
    for (const [y, sockOn, plugOn] of defs[k]) {
      place(PCB5, g, [135.323, y, 84.523], [0, Math.PI, 0]);
      box(g, -10.9, -0.38, y + 1.6, y + 2.1, 0.51, 9.48, mat(C.chip)); box(g, 0.38, 10.9, y + 1.6, y + 2.1, 0.51, 9.48, mat(C.chip));
      dfSock(g, y, sockOn); dfPlug(g, y + 1.6, plugOn);
      for (const x of [-8, -3, 3, 8]) box(g, x - 0.15, x + 0.15, y + 0.65, y + 0.95, -6, 0.3, mat(C.probe));
    }

}
function hdmi(g, [x, y, z], up) {

  else { box(g, x - 5.5, x + 5.5, y, y + 20, z - 2.75, z + 2.75, mat(C.hdmi)); box(g, x - 2.25, x + 2.25, y + 20, y + 35, z - 2.25, z + 2.25, mat(C.cable)); }
}
// LDO hat + Frontend, centred on stack y = 0.8 + dy, hat underside at HZ; under(g) draws the connector beneath
function hatAndFrontend(o, dy, HZ, under) {
  const hat = grp(o, 'hat'); under(hat);
  box(hat, -11.32, 11.32, 0.8 + dy - 12.735, 0.8 + dy + 12.735, HZ, HZ + 1.6, mat(C.ldo));
  for (const [x, y] of [[-8.5, -9.6], [-4.2, -9.6], [0.1, -9.6], [4.4, -9.6], [-8.5, -6], [-4.2, -6], [0.1, -6], [4.4, -6], [7.5, 9.6]])
    box(hat, x - 1.5, x + 1.5, y + dy - 1.5, y + dy + 1.5, HZ - 0.75, HZ, mat(C.reg));
  box(hat, -8.5, -4.5, 7.6 + dy, 11.6 + dy, HZ - 0.9, HZ, mat(C.reg));
  for (const y of [7.8, 11.2]) { box(hat, -2.8, -0.8, y + dy - 0.8, y + dy + 0.8, HZ - 1, HZ, mat(C.ind)); box(hat, 1, 2.7, y + dy - 0.65, y + dy + 0.65, HZ - 0.9, HZ, mat(C.ind)); }
  conn(hat, '70DP', 'z', HZ + 1.6, +1, 'y', { x: 8.745, y: 1.53 + dy }) || box(hat, 6.33, 11.16, -6.83 + dy, 9.89 + dy, HZ + 1.6, HZ + 2.15, mat(C.mated));
  conn(hat, '70DP', 'z', HZ + 1.6, +1, 'x', { x: -0.955, y: -9.345 + dy }) || box(hat, -9.31, 7.40, -11.76 + dy, -6.93 + dy, HZ + 1.6, HZ + 2.15, mat(C.mated));
  const fe = grp(o, 'fe'), FZ = HZ + 3.1;
  conn(fe, '70DS', 'z', FZ, -1, 'y', { x: 8.745, y: 1.53 + dy }) || box(fe, 6.33, 11.16, -6.83 + dy, 9.89 + dy, HZ + 2.15, FZ, mat(C.mated));
  conn(fe, '70DS', 'z', FZ, -1, 'x', { x: -0.955, y: -9.345 + dy }) || box(fe, -9.31, 7.40, -11.76 + dy, -6.93 + dy, HZ + 2.15, FZ, mat(C.mated));
  place(FE, fe, [-113.505, 110.01 + dy, FZ], [Math.PI / 2, 0, 0]);
  hdmi(fe, [-1.0, 14.6 + dy, FZ + 3.22], false);
  o.exp.hat = [0, 0, 14]; o.exp.fe = [0, 0, 22];

function buildA() {
  const o = mkOption('A'); asicPairs(o);
  const END = LB + 0.5 + 25.47, b = grp(o, 'board');
  box(b, -11.32, 11.32, 0, 1.6, HUB0, END, mat(C.a)); dfPlug(b, 1.6, true); dfSock(b, 0, true);
  conn(b, '70DP', 'y', 1.6, +1, 'z', { x: -8.745, z: 31.095 }) || box(b, -11.16, -6.33, 1.6, 2.15, 22.74, 39.45, mat(C.mated));
  conn(b, '70DP', 'y', 1.6, +1, 'x', { x: 0.955, z: 20.225 }) || box(b, -7.40, 9.31, 1.6, 2.15, 17.81, 22.64, mat(C.mated));
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const x = -7 + c * 6.5, z = 21 + r * 5; box(b, x - 1.5, x + 1.5, -0.75, 0, z - 1.5, z + 1.5, mat(C.reg)); }
  box(b, -2, 2, -0.9, 0, 36, 40, mat(C.reg)); box(b, 4, 6, -1, 0, 36.5, 38.1, mat(C.ind)); box(b, 4, 6, -1, 0, 38.8, 40.4, mat(C.ind));
  const fe = grp(o, 'fe');
  conn(fe, '70DS', 'y', 3.1, -1, 'z', { x: -8.745, z: 31.095 }) || box(fe, -11.16, -6.33, 2.15, 3.1, 22.74, 39.45, mat(C.mated));
  conn(fe, '70DS', 'y', 3.1, -1, 'x', { x: 0.955, z: 20.225 }) || box(fe, -7.40, 9.31, 2.15, 3.1, 17.81, 22.64, mat(C.mated));
  place(FE, fe, [113.505, 3.1, 139.575], [0, Math.PI, 0]);
  hdmi(fe, [1.0, 6.3, 44.22], true);
  o.exp.fe = [0, 9, 0];
  o.cam = [[165, 55, 65], [0, 38, 0]];
}
// ---- V9: B and C plug in the same direction as A (module parallel to the hub, on its far end), small Hirose parts only.
// Hub/pad top: DF40C-70DP x2 at Frontend J1/J2 positions; LDO underside: DF40HC(3.0)-70DS x2 (3.0 mm stack, room for
// regulators); LDO top: DF40C-70DP x2; Frontend V37 DF40C-70DS x2 (1.5 mm). dz shifts the Frontend end along L.
function plugs70(g, y, dz) {
  conn(g, '70DP', 'y', y, +1, 'z', { x: -8.745, z: 31.095 + dz }) || box(g, -11.16, -6.33, y, y + 0.55, 22.74 + dz, 39.45 + dz, mat(C.mated));
  conn(g, '70DP', 'y', y, +1, 'x', { x: 0.955, z: 20.225 + dz }) || box(g, -7.40, 9.31, y, y + 0.55, 17.81 + dz, 22.64 + dz, mat(C.mated));
}
function socksHC(g, y, dz) {   // DF40HC(3.0)-70DS: box at catalogue size, 16.6 x 3.38 x 2.95 mm, hanging below face y
  const m = mat(0x2b2d31);
  box(g, -8.745 - 1.69, -8.745 + 1.69, y - 2.95, y, 31.095 + dz - 8.3, 31.095 + dz + 8.3, m);
  box(g, 0.955 - 8.3, 0.955 + 8.3, y - 2.95, y, 20.225 + dz - 1.69, 20.225 + dz + 1.69, m);
}
function ldoModule(o, L0, yB) {
  const dz = L0 - 17.63, y0 = yB + 3.0, y1 = y0 + 1.6, hat = grp(o, 'hat');
  socksHC(hat, y0, dz);
  box(hat, -11.32, 11.32, y0, y1, L0, L0 + 25.47, mat(C.ldo));
  for (const x of [-3.5, 1.0, 5.5]) for (const z of [25, 29.5, 34]) box(hat, x - 1.5, x + 1.5, y0 - 0.75, y0, z + dz - 1.5, z + dz + 1.5, mat(C.reg));
  box(hat, 0.5, 4.5, y0 - 0.9, y0, 38 + dz, 42 + dz, mat(C.reg));
  for (const z of [38.6, 41.2]) { box(hat, 6, 8, y0 - 1, y0, z + dz - 0.8, z + dz + 0.8, mat(C.ind)); box(hat, 9, 10.7, y0 - 0.9, y0, z + dz - 0.65, z + dz + 0.65, mat(C.ind)); }

  conn(fe, '70DS', 'y', yF, -1, 'x', { x: 0.955, z: 20.225 + dz }) || box(fe, -7.40, 9.31, yF - 0.95, yF, 17.81 + dz, 22.64 + dz, mat(C.mated));
  place(FE, fe, [113.505, yF, 139.575 + dz], [0, Math.PI, 0]);

function buildB() {
  const o = mkOption('B'); asicPairs(o);

function buildC() {
  const o = mkOption('C'); asicPairs(o);

  box(hub, -11.32, 11.32, 0, 1.6, HUB0, HUB1, mat(C.hub)); dfPlug(hub, 1.6, true); dfSock(hub, 0, true);

const DFP = [['DF40C-80DS-0.4V(51)', 'ASIC boards, underside (J3)', 4, 'Hirose · LCSC C312960 · on PCB-5'],

const INFO = {
  A: { title: 'A · One board', sub: 'Hub and LDO on one board; the Frontend plugs on its far end.',

function info() {
  const wrap = document.getElementById('wrap'), el = document.getElementById('info');
  if (cur === 'all') { wrap.classList.remove('side'); el.innerHTML = ''; resize(); return; }
  const d = INFO[cur], total = d.parts.reduce((n, p) => n + p[2], 0);
  el.innerHTML = `<h2>${d.title}</h2><p class="sub">${d.sub}</p>
    <h3>Connectors (${total} parts)</h3><table>${d.parts.map(([pn, where, q, note]) =>
      `<tr><td><span class="pn">${pn}</span><br><span class="w">${where} · ${note}</span></td><td class="q">×${q}</td></tr>`).join('')}</table>
    <h3>Pros</h3><ul>${d.pros.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3>Cons</h3><ul>${d.cons.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="w" style="margin-top:12px">Connectors are drawn as boxes at their data-sheet sizes. Concept V9, 6 Nov 2026; no board has been laid out.</p>`;
  wrap.classList.add('side'); resize();
}
let cur = 'all', mode = 'head';
function apply() {
  const shown = cur === 'all' ? ['A', 'B', 'C'] : [cur], off = { A: 70, B: 0, C: -70 };
  for (const k in options) {
    const o = options[k]; o.root.visible = shown.includes(k); o.root.position.z = cur === 'all' ? off[k] : 0;
    for (const g in o.groups) o.groups[g].position.set(...(mode === 'exploded' ? (o.exp[g] || [0, 0, 0]) : [0, 0, 0]));
  }
  const c = cur === 'all' ? [[250, mode === 'exploded' ? 80 : 60, 30], [0, 30, 0]] : options[cur].cam;
  camera.position.set(...c[0]); controls.target.set(...c[1]); controls.update();
  document.querySelectorAll('[data-o]').forEach(b => b.classList.toggle('on', b.dataset.o === cur));
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  info();
}
document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { cur = b.dataset.o; apply(); });
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; apply(); });
const loader = new GLTFLoader();
// Public copy: boards are this project's own KiCad exports; manufacturer connector models are not redistributed
// here, so missing files fall back to boxes at data-sheet size.
Promise.all([loader.loadAsync('models/ASIC_Board_PCB5.glb'), loader.loadAsync('models/Artix_Frontend_V37.glb')])
.then(([a, f]) => {
  PCB5 = a.scene; PCB5.scale.setScalar(1000); FE = f.scene; FE.scale.setScalar(1000);
  buildA(); buildB(); buildC(); apply();
}).catch(e => console.error(e));
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
