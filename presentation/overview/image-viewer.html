<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native design view</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;font:11px Arial,system-ui;color:#213e50;background:#eef3f5}#title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header>div{flex-shrink:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:white;border-bottom:1px solid #dce3e7;height:43px}button{font:inherit;color:inherit;border:1px solid #c9d5da;background:white;border-radius:4px;padding:5px 10px;cursor:pointer}button:focus-visible{outline:2px solid #327b9c}#stage{position:absolute;inset:43px 0 26px;overflow:hidden;touch-action:none;cursor:grab}#stage.dragging{cursor:grabbing}img{position:absolute;width:94%;height:94%;left:3%;top:3%;object-fit:contain;transform-origin:center;user-select:none;pointer-events:none}footer{position:absolute;bottom:0;left:0;right:0;padding:7px 14px;font-size:10px;color:#526674}#status{position:absolute;top:50%;width:100%;text-align:center}</style></head><body><header><span id="title">Native design view</span><div><span id="sides" hidden><button data-side="front" aria-pressed="true">Front</button> <button data-side="back" aria-pressed="false">Back</button> </span><button id="out" aria-label="Zoom out">−</button> <button id="in" aria-label="Zoom in">+</button> <button id="fit">Fit</button></div></header><div id="stage" tabindex="0" aria-label="Native drawing. Drag to pan, scroll to zoom."><img id="drawing" alt="Native KiCad design drawing" draggable="false"><p id="status" role="status">Loading drawing…</p></div><footer>Drag to pan · scroll to zoom · Fit to reset</footer><script src="image-viewer.js"></script></body></html>
