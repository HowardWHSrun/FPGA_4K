<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384.000 247.500" role="img" aria-labelledby="title desc">
<title id="title">U5: labeled pins, native PCB top view</title>
<desc id="desc">Gold U means unassigned. Red exclamation means GND required but NC in saved CAD. Purple question mark means grounding review for FB2 marked NC in saved CAD. Gray A means assigned on a net with routing gaps, green A means assigned on a connected net. Pad centers follow native PCB coordinates.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="18" font-family="sans-serif" font-size="12" fill="#526478">U5 · PCB top view · board up ↑</text>
